name: Trigger auto deployment for thesis

on:
  push:
    branches: [main]
    paths: ['**']
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage 3, revised: Azure Container Apps is abandoned in favor of RunPod.
      # Push to main now does exactly this — build and publish the image — and
      # nothing else. There is deliberately no deploy/start step of any kind
      # here: RunPod runs are started manually via the pod console's "Start
      # command" override, which pulls this image by tag (see README "Running
      # the sweep"). That keeps the original Stage 3 guarantee — a push can
      # never auto-start a paid GPU sweep — true for the current platform too,
      # by construction rather than by a since-abandoned Container Apps Job
      # resource that was never actually provisioned.
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/simarjit1303/rag-adversarial-robustness/thesis:${{ github.sha }}
