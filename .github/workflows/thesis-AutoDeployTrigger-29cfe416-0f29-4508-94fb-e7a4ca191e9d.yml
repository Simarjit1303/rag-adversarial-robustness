name: Trigger auto deployment for thesis

on:
  push:
    branches: [main]
    paths: ['**']
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      # 2026-09-04: the build failed with "No space left on device" during
      # pip install (torch+vllm+transformers+datasets+sentence-transformers
      # is several GB even after removing the unused langchain dependency
      # tree -- see requirements.txt's removal note). Larger GitHub-hosted
      # runners aren't an option here: confirmed via `gh api
      # repos/.../actions/hosted-runners` (404) that they require an
      # organization on GitHub Team/Enterprise Cloud, not available for a
      # personal-account repo. Hand-written rather than a third-party
      # action (e.g. jlumbroso/free-disk-space): this repo already prefers
      # owning the exact mechanism over a dependency with its own trust/
      # maintenance surface -- see scripts/run_and_terminate.py's direct
      # `requests.delete` call instead of the `runpod` SDK, for the same
      # reason. These are ubuntu-latest's standard large preinstalled
      # toolchains, all unrelated to this Python/Docker build.
      - name: Free disk space (remove unrelated preinstalled toolchains)
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune -af || true
          echo "After cleanup:"
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/simarjit1303/rag-adversarial-robustness/thesis:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.THESIS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.THESIS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.THESIS_AZURE_SUBSCRIPTION_ID }}

      # Stage 3: this updates a Container Apps JOB, not the old Container App.
      # A Job does not auto-execute when its image reference changes — that
      # structural difference is the fix for the overnight restart-loop billing
      # scare, not a manual-trigger flag on the old resource. Deliberately NO
      # `az containerapp job start` here, under any condition: starting a sweep
      # is a manual, human decision (see README "Running the sweep").
      # Until Part B provisions `rag-sweep-job`, this step fails — expected;
      # do not add fallback logic pointing back at the old Container App.
      - name: Update Container Apps Job image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            # NOTE: no `az containerapp registry set` here on purpose. The GHCR
            # package is public, so pulls are anonymous. Storing GITHUB_TOKEN as
            # the registry password breaks pulls after the workflow ends (the
            # token expires) — that caused the 2026-07-10 ImagePullUnauthorized
            # outage. If the package ever goes private again, use a classic PAT
            # with read:packages stored as a repo secret instead.
            az containerapp job update \
              --name rag-sweep-job \
              --resource-group Master-Thesis \
              --image ghcr.io/simarjit1303/rag-adversarial-robustness/thesis:${{ github.sha }}
