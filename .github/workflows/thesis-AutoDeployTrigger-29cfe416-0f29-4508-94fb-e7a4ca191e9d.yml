name: Trigger auto deployment for thesis

on:
  push:
    branches: [main]
    paths: ['**']
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/simarjit1303/rag-adversarial-robustness/thesis:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.THESIS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.THESIS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.THESIS_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp registry set \
              --name thesis \
              --resource-group Master-Thesis \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GITHUB_TOKEN }}
            az containerapp update \
              --name thesis \
              --resource-group Master-Thesis \
              --image ghcr.io/simarjit1303/rag-adversarial-robustness/thesis:${{ github.sha }}
