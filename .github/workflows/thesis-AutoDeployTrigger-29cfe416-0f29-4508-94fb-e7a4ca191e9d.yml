name: Trigger auto deployment for thesis

# When this action will be executed
on:
  # Automatically trigger it when changes are detected in the repo
  push:
    branches: 
      - main
    paths:
      - '**'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.THESIS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.THESIS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.THESIS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: 
          registryUsername: ${{ secrets.THESIS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.THESIS_REGISTRY_PASSWORD }}
          containerAppName: thesis
          resourceGroup: Master-Thesis
          imageToBuild: thesis:${{ github.sha }}
