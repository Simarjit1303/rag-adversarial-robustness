name: Trigger auto deployment for thesis

on:
  push:
    branches: 
      - main
    paths:
      - '**'
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write  # Gives GitHub permission to save your container image

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      # Step 1: Log directly into GitHub's completely free Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Build the image using your Dockerfile and save it to GitHub
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/thesis:${{ github.sha }}

      # Step 3: Log into your Azure account
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.THESIS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.THESIS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.THESIS_AZURE_SUBSCRIPTION_ID }}

      # Step 4: Tell Azure to just pull the finished image directly from GitHub
      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade
            az containerapp update \
              --name thesis \
              --resource-group Master-Thesis \
              --image ghcr.io/${{ github.repository.name }}/thesis:${{ github.sha }}
